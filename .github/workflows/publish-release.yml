name: Publish standalone recruiting system

on:
  # Automatically publish the first stable release when this workflow lands.
  push:
    branches: [main]
    paths: [.github/workflows/publish-release.yml]
  # Future releases are intentionally manual, with an explicit new version.
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag (example: v1.0.1)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'PrintOrb/recruiting-intake-demo'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          for script in operational/assets/js/*.js; do node --check "$script"; done
      - name: Assemble clean non-demo release
        env:
          RELEASE_TAG: ${{ inputs.version || 'v1.0.0' }}
        run: python3 .github/scripts/build_release.py --version "$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || 'v1.0.0' }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Choose a new version under Run workflow."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/Recruiting_Intake_System_${RELEASE_TAG}.zip" \
            "dist/Recruiting_Intake_System_${RELEASE_TAG}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Recruiting Intake System $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            --latest
