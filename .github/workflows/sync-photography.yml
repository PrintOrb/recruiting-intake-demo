name: Bundle real Air Force backgrounds

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-photography.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public-domain DVIDS images
        run: python3 .github/scripts/fetch_air_force_photos.py
      - name: Commit downloaded photos for offline use
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/images/AF_*.jpg operational/assets/images/AF_*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle authentic USAF photos for kiosk backgrounds'
            git push origin HEAD:main
          fi
